<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="980" height="560" fill="#ffffff"/>
  <text x="28" y="38" font-size="20" font-weight="600" fill="#111827">homelab-monitoring — what is collected, and what happens when it goes wrong</text>
  <text x="28" y="58" font-size="12" fill="#6b7280">Prometheus pulls. Nothing pushes to it, which is why a dead exporter is itself a signal.</text>

  <rect x="24" y="84" width="248" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="40" y="106" font-size="12" font-weight="600" fill="#64748b">sources</text>

  <rect x="44" y="120" width="208" height="52" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="148" y="141" font-size="13" font-weight="600" text-anchor="middle" fill="#1e3a8a">node-exporter</text>
  <text x="148" y="159" font-size="11" text-anchor="middle" fill="#1d4ed8">cpu, memory, disks, network</text>

  <rect x="44" y="182" width="208" height="52" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="148" y="203" font-size="13" font-weight="600" text-anchor="middle" fill="#1e3a8a">cAdvisor</text>
  <text x="148" y="221" font-size="11" text-anchor="middle" fill="#1d4ed8">per container cpu and memory</text>

  <rect x="44" y="244" width="208" height="52" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="148" y="265" font-size="13" font-weight="600" text-anchor="middle" fill="#1e3a8a">blackbox-exporter</text>
  <text x="148" y="283" font-size="11" text-anchor="middle" fill="#1d4ed8">http and tcp probes from outside</text>

  <rect x="44" y="306" width="208" height="92" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="148" y="327" font-size="13" font-weight="600" text-anchor="middle" fill="#14532d">textfile collector</text>
  <text x="148" y="345" font-size="11" text-anchor="middle" fill="#15803d">any script that can write a file</text>
  <text x="148" y="365" font-size="11" text-anchor="middle" fill="#166534">backup-automation drops</text>
  <text x="148" y="381" font-size="11" text-anchor="middle" fill="#166534">a .prom after every run</text>

  <rect x="316" y="130" width="200" height="150" rx="10" fill="#fff7ed" stroke="#ea580c"/>
  <text x="416" y="158" font-size="15" font-weight="600" text-anchor="middle" fill="#7c2d12">Prometheus</text>
  <text x="416" y="180" font-size="11" text-anchor="middle" fill="#9a3412">scrape every 15 s</text>
  <text x="416" y="198" font-size="11" text-anchor="middle" fill="#9a3412">30 days retained</text>
  <text x="416" y="222" font-size="11" text-anchor="middle" fill="#9a3412">16 alert rules</text>
  <text x="416" y="240" font-size="11" text-anchor="middle" fill="#9a3412">10 recording rules</text>
  <text x="416" y="264" font-size="11" font-weight="600" text-anchor="middle" fill="#7c2d12">rules are unit tested</text>

  <rect x="580" y="96" width="200" height="104" rx="10" fill="#fef2f2" stroke="#dc2626"/>
  <text x="680" y="122" font-size="15" font-weight="600" text-anchor="middle" fill="#7f1d1d">Alertmanager</text>
  <text x="680" y="144" font-size="11" text-anchor="middle" fill="#b91c1c">grouped by alert and instance</text>
  <text x="680" y="162" font-size="11" text-anchor="middle" fill="#b91c1c">2 inhibition rules</text>
  <text x="680" y="182" font-size="11" text-anchor="middle" fill="#b91c1c">critical repeats hourly</text>

  <rect x="580" y="230" width="200" height="86" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="680" y="256" font-size="15" font-weight="600" text-anchor="middle" fill="#4c1d95">Grafana</text>
  <text x="680" y="278" font-size="11" text-anchor="middle" fill="#6d28d9">dashboard provisioned from</text>
  <text x="680" y="294" font-size="11" text-anchor="middle" fill="#6d28d9">a file, not clicked together</text>

  <rect x="824" y="96" width="132" height="104" rx="10" fill="#ffffff" stroke="#9ca3af"/>
  <text x="890" y="122" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">runbook</text>
  <text x="890" y="144" font-size="11" text-anchor="middle" fill="#4b5563">every alert links</text>
  <text x="890" y="160" font-size="11" text-anchor="middle" fill="#4b5563">to the page that</text>
  <text x="890" y="176" font-size="11" text-anchor="middle" fill="#4b5563">says what to do</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <path d="M252 146 L310 176" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M252 208 L310 196" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M252 270 L310 216" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M148 306 L148 296" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="286" y="120" font-size="10" text-anchor="middle" fill="#334155">pull</text>

  <path d="M516 176 L574 148" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="548" y="150" font-size="10" text-anchor="middle" fill="#334155">fires</text>

  <path d="M516 232 L574 262" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="548" y="264" font-size="10" text-anchor="middle" fill="#334155">query</text>

  <path d="M780 148 L818 148" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <rect x="316" y="330" width="464" height="84" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="334" y="354" font-size="12" font-weight="600" fill="#334155">the drill, end to end</text>
  <text x="334" y="376" font-size="11" fill="#475569">stop an exporter → pending at 30 s → firing at 120 s → in Alertmanager immediately</text>
  <text x="334" y="396" font-size="11" fill="#475569">start it again → cleared 30 s later. Measured, not assumed.</text>

  <rect x="24" y="434" width="932" height="100" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="458" font-size="12" font-weight="600" fill="#334155">why the textfile collector matters</text>
  <text x="44" y="480" font-size="11" fill="#475569">A backup job that fails loudly is easy to catch. One that exits 0 having archived nothing looks perfectly healthy,</text>
  <text x="44" y="498" font-size="11" fill="#475569">and that is the failure people discover a year later during a restore. Five rules read those metrics, including</text>
  <text x="44" y="516" font-size="11" fill="#475569">"succeeded but wrote no archive" and "came out half the size it usually does".</text>
</svg>
