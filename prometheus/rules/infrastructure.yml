groups:
  - name: availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/Alex-2rios/homelab-monitoring/blob/main/docs/runbooks.md#targetdown"
          summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for 2 minutes."

      - alert: EndpointDown
        expr: probe_success == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/Alex-2rios/homelab-monitoring/blob/main/docs/runbooks.md#endpointdown"
          summary: "{{ $labels.instance }} is not responding to probes"
          description: "The blackbox probe for {{ $labels.instance }} has failed for 3 minutes."

      - alert: EndpointSlow
        expr: probe_duration_seconds > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/Alex-2rios/homelab-monitoring/blob/main/docs/runbooks.md#endpointslow"
          summary: "{{ $labels.instance }} is answering slowly"
          description: "Probe duration has been above 2 s for 10 minutes, currently {{ $value | humanizeDuration }}."

      - alert: CertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 21
        for: 1h
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/Alex-2rios/homelab-monitoring/blob/main/docs/runbooks.md#certificateexpiringsoon"
          summary: "TLS certificate for {{ $labels.instance }} expires in {{ $value | printf \"%.0f\" }} days"
          description: "Renew it before it expires, three weeks of warning should be enough."

  - name: host
    rules:
      - alert: HostHighCpu
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/Alex-2rios/homelab-monitoring/blob/main/docs/runbooks.md#hosthighcpu"
          summary: "CPU on {{ $labels.instance }} above 85 percent"
          description: "Sustained for 10 minutes, currently {{ $value | printf \"%.0f\" }} percent."

      - alert: HostHighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/Alex-2rios/homelab-monitoring/blob/main/docs/runbooks.md#hosthighmemory"
          summary: "Memory on {{ $labels.instance }} above 90 percent"
          description: "Available memory is down to {{ $value | printf \"%.0f\" }} percent used."

      - alert: HostDiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100 < 15
        for: 15m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/Alex-2rios/homelab-monitoring/blob/main/docs/runbooks.md#hostdiskspacelow"
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | printf \"%.0f\" }} percent free"
          description: "Clean it up or grow the volume."

      - alert: HostDiskWillFill
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 24 * 3600) < 0
          and on (instance, mountpoint)
          (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 30
        for: 30m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/Alex-2rios/homelab-monitoring/blob/main/docs/runbooks.md#hostdiskwillfill"
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} fills up within 24 hours"
          description: "Based on the last 6 hours of growth. This is the one that actually saves you."

      - alert: HostUnexpectedReboot
        expr: node_time_seconds - node_boot_time_seconds < 300
        for: 1m
        labels:
          severity: info
        annotations:
          runbook_url: "https://github.com/Alex-2rios/homelab-monitoring/blob/main/docs/runbooks.md#hostunexpectedreboot"
          summary: "{{ $labels.instance }} rebooted"
          description: "Uptime is under 5 minutes. If nobody planned this, find out why."

  - name: containers
    rules:
      - alert: ContainerRestartLoop
        expr: increase(container_start_time_seconds{name!=""}[15m]) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/Alex-2rios/homelab-monitoring/blob/main/docs/runbooks.md#containerrestartloop"
          summary: "Container {{ $labels.name }} keeps restarting"
          description: "More than two restarts in the last 15 minutes."

      - alert: ContainerHighMemory
        expr: |
          (container_memory_usage_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""}) * 100 > 90
          and container_spec_memory_limit_bytes{name!=""} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/Alex-2rios/homelab-monitoring/blob/main/docs/runbooks.md#containerhighmemory"
          summary: "Container {{ $labels.name }} is near its memory limit"
          description: "At {{ $value | printf \"%.0f\" }} percent of the limit, the OOM killer is next."
