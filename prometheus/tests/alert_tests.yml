rule_files:
  - ../rules/infrastructure.yml
  - ../rules/backups.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: a target that stops answering fires TargetDown, but not before the hold time
    input_series:
      - series: 'up{job="node",instance="node-exporter:9100"}'
        values: "1 1 0 0 0 0 0"

    alert_rule_test:
      - eval_time: 3m
        alertname: TargetDown
        exp_alerts: []

      - eval_time: 5m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: node-exporter:9100
            exp_annotations:
              runbook_url: "https://github.com/Alex-2rios/homelab-monitoring/blob/main/docs/runbooks.md#targetdown"
              summary: "node target node-exporter:9100 is down"
              description: "Prometheus has not been able to scrape node-exporter:9100 for 2 minutes."

  - interval: 1m
    name: a healthy target never alerts
    input_series:
      - series: 'up{job="node",instance="node-exporter:9100"}'
        values: "1+0x10"

    alert_rule_test:
      - eval_time: 10m
        alertname: TargetDown
        exp_alerts: []

  - interval: 1m
    name: a failing probe fires EndpointDown after three minutes
    input_series:
      - series: 'probe_success{instance="https://github.com",job="blackbox-http"}'
        values: "1 0 0 0 0 0"

    alert_rule_test:
      - eval_time: 2m
        alertname: EndpointDown
        exp_alerts: []

      - eval_time: 5m
        alertname: EndpointDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox-http
              instance: https://github.com
            exp_annotations:
              runbook_url: "https://github.com/Alex-2rios/homelab-monitoring/blob/main/docs/runbooks.md#endpointdown"
              summary: "https://github.com is not responding to probes"
              description: "The blackbox probe for https://github.com has failed for 3 minutes."

  - interval: 1m
    name: a filesystem under fifteen percent free fires HostDiskSpaceLow
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="host",mountpoint="/",fstype="ext4"}'
        values: "12+0x30"
      - series: 'node_filesystem_size_bytes{instance="host",mountpoint="/",fstype="ext4"}'
        values: "100+0x30"

    alert_rule_test:
      - eval_time: 10m
        alertname: HostDiskSpaceLow
        exp_alerts: []

      - eval_time: 20m
        alertname: HostDiskSpaceLow
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: host
              mountpoint: /
              fstype: ext4
            exp_annotations:
              runbook_url: "https://github.com/Alex-2rios/homelab-monitoring/blob/main/docs/runbooks.md#hostdiskspacelow"
              summary: "/ on host is 12 percent free"
              description: "Clean it up or grow the volume."

  - interval: 1m
    name: a healthy filesystem does not alert
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="host",mountpoint="/",fstype="ext4"}'
        values: "60+0x30"
      - series: 'node_filesystem_size_bytes{instance="host",mountpoint="/",fstype="ext4"}'
        values: "100+0x30"

    alert_rule_test:
      - eval_time: 25m
        alertname: HostDiskSpaceLow
        exp_alerts: []

  - interval: 1m
    name: a backup job that exits non zero fires BackupFailed
    input_series:
      - series: 'backup_last_run_exit_code{backup_job="homelab"}'
        values: "0 0 5 5 5 5 5 5"

    alert_rule_test:
      - eval_time: 3m
        alertname: BackupFailed
        exp_alerts: []

      - eval_time: 8m
        alertname: BackupFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              backup_job: homelab
            exp_annotations:
              runbook_url: "https://github.com/Alex-2rios/homelab-monitoring/blob/main/docs/runbooks.md#backupfailed"
              summary: "Backup job homelab finished with exit code 5"
              description: "2 means an archive failed verification, 4 a source was missing, 5 the second copy failed, 6 the offsite push failed."

  - interval: 1m
    name: a backup that has not succeeded in over a day fires BackupTooOld
    input_series:
      - series: 'backup_last_success_timestamp_seconds{backup_job="homelab"}'
        values: "-95000+0x40"

    alert_rule_test:
      - eval_time: 30m
        alertname: BackupTooOld
        exp_alerts:
          - exp_labels:
              severity: critical
              backup_job: homelab
            exp_annotations:
              runbook_url: "https://github.com/Alex-2rios/homelab-monitoring/blob/main/docs/runbooks.md#backuptooold"
              summary: "Backup job homelab last succeeded 27 hours ago"
              description: "The nightly timer should produce a successful run every 24 hours. Past 26 the job is either failing or not running at all."

  - interval: 1m
    name: a recent backup does not alert
    input_series:
      - series: 'backup_last_success_timestamp_seconds{backup_job="homelab"}'
        values: "-1000+0x40"
      - series: 'backup_last_run_exit_code{backup_job="homelab"}'
        values: "0+0x40"

    alert_rule_test:
      - eval_time: 30m
        alertname: BackupTooOld
        exp_alerts: []

      - eval_time: 30m
        alertname: BackupFailed
        exp_alerts: []

  - interval: 1m
    name: no backup metrics at all fires BackupMetricsMissing
    input_series:
      - series: 'up{job="node"}'
        values: "1+0x60"

    alert_rule_test:
      - eval_time: 45m
        alertname: BackupMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              runbook_url: "https://github.com/Alex-2rios/homelab-monitoring/blob/main/docs/runbooks.md#backupmetricsmissing"
              summary: "No backup metrics are being reported at all"
              description: "The textfile collector has nothing to read. Either the backup job has never run on this host or it can no longer write to METRICS_DIR."
