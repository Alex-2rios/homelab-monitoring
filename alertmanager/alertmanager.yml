global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

  routes:
    - matchers:
        - severity = critical
      receiver: critical
      group_wait: 10s
      repeat_interval: 1h

    - matchers:
        - severity = info
      receiver: quiet
      repeat_interval: 24h

receivers:
  - name: default
    webhook_configs:
      - url: http://alertmanager:9093/api/v2/alerts
        send_resolved: true

  - name: critical
    webhook_configs:
      - url: http://alertmanager:9093/api/v2/alerts
        send_resolved: true

  - name: quiet
    webhook_configs:
      - url: http://alertmanager:9093/api/v2/alerts
        send_resolved: false

inhibit_rules:
  - source_matchers:
      - alertname = TargetDown
    target_matchers:
      - severity =~ "warning|info"
    equal: [instance]

  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: [alertname, instance]
